<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 16px;
      background: transparent;
      color: #333;
    }
    #status { font-size: 12px; color: #999; margin-bottom: 10px; }
    textarea {
      width: 100%; height: 200px; padding: 10px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; resize: none; outline: none;
    }
    textarea:focus { border-color: #4a90d9; }
    .bar { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
    button {
      padding: 6px 16px; border: none; border-radius: 6px;
      background: #4a90d9; color: #fff; cursor: pointer; font-size: 13px;
    }
    button.gray { background: #e0e0e0; color: #666; }
    #saved { font-size: 12px; color: #4a90d9; }
  </style>
</head>
<body>
  <div id="status"></div>
  <textarea id="note" placeholder="随手记点什么…（存储使用 utools.db）"></textarea>
  <div class="bar">
    <button onclick="save()">保存便签 (utools.db.put)</button>
    <button class="gray" onclick="clearNote()">清空</button>
    <span id="saved"></span>
  </div>
  <script>
    const KEY = "utools-demo-note";
    window.addEventListener("load", () => {
      const doc = utools.db.get(KEY);
      if (doc) document.getElementById("note").value = doc.data.text ?? "";
    });
    function save() {
      const text = document.getElementById("note").value;
      const prev = utools.db.get(KEY);
      const r = utools.db.put({ _id: KEY, _rev: prev?._rev, data: { text, savedAt: Date.now() } });
      document.getElementById("saved").textContent = r.ok ? "已保存 ✓" : "保存失败: " + r.error;
      utools.notify(r.ok ? "便签已保存" : "保存失败");
    }
    function clearNote() {
      const prev = utools.db.get(KEY);
      if (prev) utools.db.remove({ _id: KEY, _rev: prev._rev });
      document.getElementById("note").value = "";
      document.getElementById("saved").textContent = "已清空";
    }
  </script>
</body>
</html>
